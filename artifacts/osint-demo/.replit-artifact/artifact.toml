kind = "web"
previewPath = "/"
title = "Passive OSINT Demo"
version = "1.0.0"
id = "artifacts/osint-demo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25389

[services.development]
run = "pnpm --filter @workspace/osint-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/osint-demo", "run", "build" ]
publicDir = "artifacts/osint-demo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25389"
BASE_PATH = "/"
