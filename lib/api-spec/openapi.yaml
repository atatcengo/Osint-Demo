openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: osint
    description: OSINT scanning operations
  - name: history
    description: Scan history operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /osint/config:
    get:
      operationId: getOsintConfig
      tags: [osint]
      summary: Get OSINT API key configuration
      description: Returns which optional API integrations are configured
      responses:
        "200":
          description: Config status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsintConfig"
  /osint/scan:
    post:
      operationId: runOsintScan
      tags: [osint]
      summary: Run a passive OSINT scan on a domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: Invalid domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /osint/report:
    post:
      operationId: generateOsintReport
      tags: [osint]
      summary: Generate a Markdown report from scan results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanResult"
      responses:
        "200":
          description: Markdown report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkdownReport"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /history:
    get:
      operationId: listScanHistory
      tags: [history]
      summary: List all saved scan history entries
      responses:
        "200":
          description: List of scan history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanHistoryEntry"
    post:
      operationId: saveScanResult
      tags: [history]
      summary: Save a scan result to history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanResult"
      responses:
        "201":
          description: Saved history entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanHistoryEntry"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /history/{id}:
    get:
      operationId: getScanHistoryEntry
      tags: [history]
      summary: Get a specific scan history entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scan history entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanHistoryEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteScanHistoryEntry
      tags: [history]
      summary: Delete a scan history entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OsintConfig:
      type: object
      properties:
        shodanConfigured:
          type: boolean
        virusTotalConfigured:
          type: boolean
        urlscanConfigured:
          type: boolean
        abuseIpDbConfigured:
          type: boolean
      required:
        - shodanConfigured
        - virusTotalConfigured
        - urlscanConfigured
        - abuseIpDbConfigured
    ScanRequest:
      type: object
      properties:
        domain:
          type: string
          description: Domain to scan (e.g. example.com or sub.example.com)
      required:
        - domain
    SubdomainEntry:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    DnsRecords:
      type: object
      properties:
        A:
          type: array
          items:
            type: string
        MX:
          type: array
          items:
            type: string
        TXT:
          type: array
          items:
            type: string
        NS:
          type: array
          items:
            type: string
      required:
        - A
        - MX
        - TXT
        - NS
    DnsSecurityInfo:
      type: object
      properties:
        spf:
          type: array
          items:
            type: string
        dmarc:
          type: string
        dmarcPolicy:
          type: string
        caa:
          type: array
          items:
            type: string
        dnssec:
          type: boolean
        dnssecRecords:
          type: array
          items:
            type: string
        mtaSts:
          type: string
        tlsRpt:
          type: string
      required:
        - spf
        - caa
        - dnssec
        - dnssecRecords
    ShodanHostInfo:
      type: object
      properties:
        ip:
          type: string
        ports:
          type: array
          items:
            type: integer
        hostnames:
          type: array
          items:
            type: string
        org:
          type: string
        isp:
          type: string
        country:
          type: string
        tags:
          type: array
          items:
            type: string
        vulns:
          type: array
          items:
            type: string
          description: CVEs reported by Shodan (not confirmed vulnerabilities)
      required:
        - ip
        - ports
        - hostnames
        - org
        - isp
        - country
        - tags
        - vulns
    CisaKevMatch:
      type: object
      properties:
        cveID:
          type: string
        vendorProject:
          type: string
        product:
          type: string
        vulnerabilityName:
          type: string
        dateAdded:
          type: string
        dueDate:
          type: string
        knownRansomwareCampaignUse:
          type: string
      required:
        - cveID
    CisaKevInfo:
      type: object
      properties:
        catalogVersion:
          type: string
        dateReleased:
          type: string
        matched:
          type: array
          items:
            $ref: "#/components/schemas/CisaKevMatch"
      required:
        - matched
    VirusTotalInfo:
      type: object
      properties:
        harmless:
          type: integer
        suspicious:
          type: integer
        malicious:
          type: integer
        undetected:
          type: integer
        reputation:
          type: integer
        categories:
          type: object
          additionalProperties:
            type: string
      required:
        - harmless
        - suspicious
        - malicious
        - undetected
        - reputation
    WhoisInfo:
      type: object
      properties:
        server:
          type: string
        registrar:
          type: string
        creationDate:
          type: string
        expirationDate:
          type: string
        updatedDate:
          type: string
        statuses:
          type: array
          items:
            type: string
        nameServers:
          type: array
          items:
            type: string
        rawText:
          type: string
      required:
        - statuses
        - nameServers
        - rawText
    UrlscanResult:
      type: object
      properties:
        url:
          type: string
        pageDomain:
          type: string
        ip:
          type: string
        country:
          type: string
        server:
          type: string
        scannedAt:
          type: string
        resultUrl:
          type: string
        screenshotUrl:
          type: string
      required:
        - url
    UrlscanInfo:
      type: object
      properties:
        total:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/UrlscanResult"
      required:
        - total
        - results
    AbuseIpInfo:
      type: object
      properties:
        ip:
          type: string
        abuseConfidenceScore:
          type: integer
        totalReports:
          type: integer
        countryCode:
          type: string
        isp:
          type: string
        domain:
          type: string
        lastReportedAt:
          type: string
      required:
        - ip
        - abuseConfidenceScore
        - totalReports
    ScanResult:
      type: object
      properties:
        domain:
          type: string
        timestamp:
          type: string
        subdomains:
          type: array
          items:
            $ref: "#/components/schemas/SubdomainEntry"
        dns:
          $ref: "#/components/schemas/DnsRecords"
        dnsSecurity:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/DnsSecurityInfo"
        whois:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/WhoisInfo"
        urlscan:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/UrlscanInfo"
        urlscanConfigured:
          type: boolean
        abuseIpDb:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AbuseIpInfo"
        abuseIpDbConfigured:
          type: boolean
        shodan:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ShodanHostInfo"
        shodanConfigured:
          type: boolean
        cisaKev:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/CisaKevInfo"
        virusTotal:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/VirusTotalInfo"
        virusTotalConfigured:
          type: boolean
        errors:
          type: object
          additionalProperties:
            type: string
      required:
        - domain
        - timestamp
        - subdomains
        - dns
        - shodanConfigured
        - virusTotalConfigured
    ScanHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        domain:
          type: string
        scannedAt:
          type: string
        result:
          $ref: "#/components/schemas/ScanResult"
      required:
        - id
        - domain
        - scannedAt
        - result
    MarkdownReport:
      type: object
      properties:
        content:
          type: string
        filename:
          type: string
      required:
        - content
        - filename
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
